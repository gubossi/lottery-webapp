<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>프로그램 신청자 추첨</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:16px;line-height:1.45}
    h1{font-size:20px;margin:0 0 12px}
    .row{display:grid;grid-template-columns:1fr;gap:12px;max-width:1020px}
    .card{border:1px solid #ddd;border-radius:14px;padding:14px;background:#fff}
    textarea{width:100%;min-height:170px;resize:vertical;border:1px solid #ccc;border-radius:10px;padding:10px;font-size:14px}
    input[type="text"]{width:min(520px,100%);padding:8px 10px;border:1px solid #ccc;border-radius:10px}
    input[type="number"]{width:90px;padding:6px 8px;border:1px solid #ccc;border-radius:10px}
    button{padding:10px 14px;border:1px solid #333;border-radius:12px;background:#111;color:#fff;cursor:pointer}
    button.secondary{background:#fff;color:#111;border-color:#999}
    button:disabled{opacity:.5;cursor:not-allowed}
    .inline{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
    .pill{display:inline-flex;align-items:center;gap:8px;border:1px solid #ddd;border-radius:999px;padding:6px 10px}
    .muted{color:#666;font-size:13px}
    ol{margin:8px 0 0 18px}
    .split{display:grid;grid-template-columns:1fr;gap:12px}
    @media (min-width:900px){ .split{grid-template-columns:1fr 1fr} }
    code.small{font-size:12px;background:#f6f6f6;padding:2px 6px;border-radius:6px}
    .danger{color:#b00020}
    .hint{background:#fafafa;border:1px dashed #ddd;border-radius:12px;padding:10px;margin-top:10px}
  </style>
</head>
<body>
  <h1>🎯 프로그램 신청자 추첨(랜덤)</h1>

  <div class="row">
    <div class="card">
      <div class="inline">
        <span class="pill">
          추첨명
          <input id="drawTitle" type="text" placeholder="예) 겨울방학 디지털드로잉 꿈나무반" />
        </span>
        <span class="pill">선발 <input id="pickCount" type="number" min="0" value="10" /> 명</span>
        <label class="pill"><input id="dedupe" type="checkbox" checked /> 중복 제거(이름+생년월일)</label>
        <label class="pill"><input id="keepLog" type="checkbox" checked /> 추첨 로그 저장(브라우저)</label>
        <button id="btnDraw" onclick="runDraw()">추첨하기</button>
        <button class="secondary" onclick="resetAll()">초기화</button>
      </div>

      <div class="muted" style="margin-top:10px">
        아래에 신청자 정보를 붙여넣으세요. (한 줄에 1명)
      </div>

      <textarea id="raw" placeholder="예)
홍길동,2015-03-01,010-1234-5678
김철수,2014-11-20,010-1111-2222

또는(엑셀에서 3열 복사 후 붙여넣기: 탭 구분)
홍길동    2015-03-01    010-1234-5678"></textarea>

      <div class="hint">
        <div class="muted">
          지원 형식: <code class="small">이름,생년월일,전화번호</code> / <code class="small">이름\t생년월일\t전화번호</code> / <code class="small">이름|생년월일|전화번호</code><br/>
          ⚠️ 개인정보 보호를 위해 <b>화면/로그에는 전화번호를 저장하지 않고</b>, <b>CSV 다운로드에만 포함</b>됩니다.
        </div>
      </div>
    </div>

    <div class="split">
      <div class="card">
        <div class="inline" style="justify-content:space-between">
          <div><b>✅ 선정자</b> <span class="muted" id="winnerCount"></span></div>
          <button class="secondary" id="btnWcsv" onclick="downloadCSV('winners')" disabled>선정자 CSV(전화 포함)</button>
        </div>
        <ol id="winners"></ol>
      </div>

      <div class="card">
        <div class="inline" style="justify-content:space-between">
          <div><b>🕒 대기자</b> <span class="muted" id="waitCount"></span></div>
          <button class="secondary" id="btnAcsv" onclick="downloadCSV('all')" disabled>전체결과 CSV(전화 포함)</button>
        </div>
        <ol id="waitlist"></ol>
      </div>
    </div>

    <div class="card">
      <div class="inline" style="justify-content:space-between">
        <div><b>🧾 추첨 로그</b> <span class="muted">(최근 10회)</span></div>
        <div class="inline">
          <button class="secondary" onclick="downloadCSV('log')">로그 CSV(전화 미포함)</button>
          <button class="secondary danger" onclick="clearLog()">로그 삭제</button>
        </div>
      </div>
      <div class="muted" style="margin-top:8px">
        로그에는 <code class="small">추첨명, 추첨일시, 총인원, 선발인원, 선정자(이름/생년월일)</code>만 저장됩니다.
      </div>
      <ol id="log"></ol>
    </div>
  </div>

<script>
  function nowKSTISOString(){
    const d = new Date();
    const pad = (n)=> String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  function shuffle(arr){
    for(let i=arr.length-1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function escapeHtml(s){
    return String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  // Parse: comma/tab/pipe
  function parseLine(line){
    let parts = [];
    if(line.includes("\t")) parts = line.split("\t");
    else if(line.includes(",")) parts = line.split(",");
    else if(line.includes("|")) parts = line.split("|");
    else parts = [line];

    parts = parts.map(x=>x.trim());

    const name  = parts[0] || "";
    const dob   = parts[1] || "";
    const phone = parts[2] || "";

    return { name, dob, phone, raw: line };
  }

  function parseLines(text){
    const lines = text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
    return lines.map(parseLine).filter(x=>x.name);
  }

  function dedupeByNameDob(list){
    const seen = new Set();
    const out = [];
    for(const item of list){
      const key = `${item.name}__${item.dob}`.toLowerCase();
      if(seen.has(key)) continue;
      seen.add(key);
      out.push(item);
    }
    return out;
  }

  // ✅ 화면 표시용: 전화번호 표시 안함
  function renderList(el, items){
    el.innerHTML = items.map(x=>{
      const meta = [x.dob].filter(Boolean).join(" · ");
      return `<li><b>${escapeHtml(x.name)}</b> <span class="muted">${meta ? "(" + escapeHtml(meta) + ")" : ""}</span></li>`;
    }).join("");
  }

  // ✅ 로그 저장용: 전화번호 제거한 스냅샷
  function stripPhone(items){
    return items.map(x=>({ name:x.name, dob:x.dob }));
  }

  let lastResult = null;
  const LOG_KEY = "lottery_logs_v3";

  function loadLogs(){
    try{
      const raw = localStorage.getItem(LOG_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      return [];
    }
  }
  function saveLogs(logs){
    localStorage.setItem(LOG_KEY, JSON.stringify(logs));
  }

  function renderLogs(){
    const logs = loadLogs().slice(-10).reverse();
    const el = document.getElementById("log");
    if(logs.length === 0){
      el.innerHTML = "<li class='muted'>저장된 로그가 없습니다.</li>";
      return;
    }
    el.innerHTML = logs.map(l=>{
      const meta = `${l.timestamp} · ${l.drawTitle || "추첨명 없음"} · 총 ${l.total}명 · 선발 ${l.pickCount}명 · 중복제거 ${l.dedupe ? "ON" : "OFF"}`;
      const winners = l.winners.map(x=> x.dob ? `${x.name}(${x.dob})` : x.name).join(", ");
      return `<li>
        <div><b>${escapeHtml(meta)}</b></div>
        <div class="muted">선정자: ${escapeHtml(winners)}</div>
      </li>`;
    }).join("");
  }

  function runDraw(){
    const drawTitle = document.getElementById("drawTitle").value.trim();
    const rawText = document.getElementById("raw").value;

    let list = parseLines(rawText);
    const useDedupe = document.getElementById("dedupe").checked;
    if(useDedupe) list = dedupeByNameDob(list);

    const pickCount = Math.max(0, parseInt(document.getElementById("pickCount").value || "0", 10));
    const total = list.length;

    if(total === 0){
      alert("신청자 명단을 입력해 주세요. (이름은 필수)");
      return;
    }

    const shuffled = shuffle(list.slice());
    const winners = shuffled.slice(0, Math.min(pickCount, total));
    const waitlist = shuffled.slice(Math.min(pickCount, total));

    renderList(document.getElementById("winners"), winners);
    renderList(document.getElementById("waitlist"), waitlist);
    document.getElementById("winnerCount").textContent = `(${winners.length}명)`;
    document.getElementById("waitCount").textContent = `(${waitlist.length}명)`;

    document.getElementById("btnWcsv").disabled = false;
    document.getElementById("btnAcsv").disabled = false;

    // lastResult에는 전화번호 포함 (CSV용)
    lastResult = {
      timestamp: nowKSTISOString(),
      drawTitle,
      total,
      dedupe: useDedupe,
      pickCount,
      winners,
      waitlist
    };

    // ✅ 로그에는 전화번호 제거해서 저장
    const keepLog = document.getElementById("keepLog").checked;
    if(keepLog){
      const logs = loadLogs();
      logs.push({
        timestamp: lastResult.timestamp,
        drawTitle: lastResult.drawTitle,
        total: lastResult.total,
        dedupe: lastResult.dedupe,
        pickCount: lastResult.pickCount,
        winners: stripPhone(lastResult.winners),
        waitlistCount: lastResult.waitlist.length
      });
      saveLogs(logs);
      renderLogs();
    }
  }

  function resetAll(){
    document.getElementById("raw").value = "";
    document.getElementById("winners").innerHTML = "";
    document.getElementById("waitlist").innerHTML = "";
    document.getElementById("winnerCount").textContent = "";
    document.getElementById("waitCount").textContent = "";
    document.getElementById("btnWcsv").disabled = true;
    document.getElementById("btnAcsv").disabled = true;
    lastResult = null;
  }

  function clearLog(){
    if(confirm("저장된 추첨 로그를 모두 삭제할까요?")){
      localStorage.removeItem(LOG_KEY);
      renderLogs();
    }
  }

  function downloadCSV(mode){
    const BOM = "\uFEFF";
    const q = (v)=> `"${String(v ?? "").replace(/"/g,'""')}"`;
    const rows = [];

    if(mode === "winners"){
      if(!lastResult){ alert("먼저 추첨을 실행해 주세요."); return; }
      rows.push(["추첨명","추첨일시","구분","순번","이름","생년월일","전화번호"].map(q).join(","));
      lastResult.winners.forEach((x, i)=>{
        rows.push([lastResult.drawTitle,lastResult.timestamp,"선정",i+1,x.name,x.dob,x.phone].map(q).join(","));
      });
      saveBlob(`${safeName(lastResult.timestamp)}_${safeName(lastResult.drawTitle || "추첨")}_선정자.csv`, BOM + rows.join("\n"));
      return;
    }

    if(mode === "all"){
      if(!lastResult){ alert("먼저 추첨을 실행해 주세요."); return; }
      rows.push(["추첨명","추첨일시","총인원","중복제거","선발인원","구분","순번","이름","생년월일","전화번호"].map(q).join(","));
      lastResult.winners.forEach((x, i)=>{
        rows.push([lastResult.drawTitle,lastResult.timestamp,lastResult.total,lastResult.dedupe?"ON":"OFF",lastResult.pickCount,"선정",i+1,x.name,x.dob,x.phone].map(q).join(","));
      });
      lastResult.waitlist.forEach((x, i)=>{
        rows.push([lastResult.drawTitle,lastResult.timestamp,lastResult.total,lastResult.dedupe?"ON":"OFF",lastResult.pickCount,"대기",i+1,x.name,x.dob,x.phone].map(q).join(","));
      });
      saveBlob(`${safeName(lastResult.timestamp)}_${safeName(lastResult.drawTitle || "추첨")}_전체결과.csv`, BOM + rows.join("\n"));
      return;
    }

    if(mode === "log"){
      const logs = loadLogs();
      if(logs.length === 0){ alert("저장된 로그가 없습니다."); return; }
      rows.push(["추첨명","추첨일시","총인원","중복제거","선발인원","선정자(이름/생년월일)","대기자수"].map(q).join(","));
      logs.forEach(l=>{
        const winnerNames = (l.winners || []).map(x=> x.dob ? `${x.name}(${x.dob})` : x.name).join(" / ");
        rows.push([l.drawTitle,l.timestamp,l.total,l.dedupe?"ON":"OFF",l.pickCount,winnerNames,l.waitlistCount ?? ""].map(q).join(","));
      });
      saveBlob(`추첨로그.csv`, BOM + rows.join("\n"));
      return;
    }
  }

  function safeName(s){
    return String(s ?? "").trim().replace(/[\\/:*?"<>|]/g,"-").replace(/\s+/g,"_");
  }

  function saveBlob(filename, content){
    const blob = new Blob([content], {type:"text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  renderLogs();
</script>
</body>
</html>
